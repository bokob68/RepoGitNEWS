[paths]
input_file = news.txt
rules_file = PROMPT_RULES.md
sample_output_file = news1.txt
output_file = review_latest.txt
archive_dir = output
write_archive = true
log_file = logs/make_review.log

[openai]
model = gpt-5
enable_web_search = true
timeout_seconds = 180
max_output_tokens = 6000
temperature =
api_base_url = https://api.openai.com/v1/responses

[schedule]
times = 08:30
poll_seconds = 20
catch_up_on_start = true
log_file = logs/review_scheduler.log

[mirror_outputs]
path_1 = ../NEWS/news1_test.txt
path_2 = ../news_bg_test.txt

[repo]
enabled = true
repo_path = .
branch = main
pull_before_run = true
push_after_run = false
commit_message = Update generated review
