[paths]
source_news_file = ../news.txt
repo_news_file = news.txt
repo_review_file = review_latest.txt
review_output_file = review_latest.txt

[schedule]
push_times = 07:00,17:30
poll_seconds = 20
review_poll_seconds = 300
catch_up_on_start = true
log_file = logs/repo_sync.log

[mirror_outputs]
path_1 = ../NEWS/news1_test.txt
path_2 = ../news_bg_test.txt

[repo]
repo_path = .
branch = main
news_commit_message = Update news input
pull_before_review_sync = true
